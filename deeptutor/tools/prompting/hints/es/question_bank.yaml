short_description: "Lee y organiza el banco de preguntas del estudiante — las preguntas de quiz calificadas en Espacio de Aprendizaje → Banco de Preguntas. NO el cuaderno."
when_to_use: "Siempre que el estudiante hable de sus preguntas, respuestas erróneas, errores o un conjunto de preguntas / 题库: revisarlas, agruparlas, archivarlas en un conjunto u ordenarlas. Empieza con action='overview' (conteos + nombres de categorías existentes), luego action='list' para obtener ids de entradas, luego action='organize' para archivar esos ids bajo un nombre de categoría. NO recurras a `write_note` para esto — una nota es prosa, el banco son preguntas calificadas, y archivar errores en un cuaderno es el almacén equivocado."
input_format: "overview: {\"action\": \"overview\"}. list: {\"action\": \"list\", \"filter\": \"wrong\" | \"uncategorized\" | \"bookmarked\" | \"all\", \"category\": nombre opcional, \"search\": texto opcional, \"limit\": opcional}. organize / unfile: {\"action\": \"organize\", \"entry_ids\": [12, 15], \"category\": \"Errores de cálculo\"}. bookmark: {\"action\": \"bookmark\", \"entry_ids\": [12], \"bookmarked\": true}."
guideline: "Los `entry_ids` son los números entre [corchetes] que muestra una llamada `list` — nunca los inventes, lista siempre primero. `organize` crea la categoría cuando el nombre es nuevo, así que archivar errores en un conjunto nuevo es UNA llamada a organize, no crear-y-luego-archivar. Reutiliza literalmente el nombre de una categoría existente cuando ya encaje (overview las lista) en lugar de crear un casi-duplicado. filter='uncategorized' es la bandeja de triaje — el punto de partida correcto para «ordena mi banco de preguntas»."
note: "Se monta automáticamente solo cuando el banco tiene entradas de verdad. Los cambios son en vivo: el estudiante los ve de inmediato en Espacio de Aprendizaje → Banco de Preguntas. Informa lo que ocurrió de verdad — el resultado dice cuántas se archivaron y si se creó una categoría nueva."
phase: "synthesis"

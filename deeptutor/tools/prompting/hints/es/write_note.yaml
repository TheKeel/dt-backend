short_description: "Guarda un registro nuevo en el cuaderno O edita uno existente. mode='append' (nuevo) o 'edit' (parchear existente)."
when_to_use: "append: el usuario pidió explícitamente guardar, o el turno produjo un desarrollo autocontenido que vale la pena conservar. Archivar preguntas de quiz o respuestas erróneas es trabajo de `question_bank`, no un registro de cuaderno. edit: el usuario pidió revisar / ampliar / corregir un registro que guardó antes. Para edit, ejecuta siempre `list_notebook` primero para tener el record_id correcto."
input_format: "append: {\"mode\": \"append\", \"notebook_id\": \"...\", \"title\": \"...\", \"turns_to_include\": \"3\" | \"all\", \"note\": \"opcional\"}. edit: {\"mode\": \"edit\", \"notebook_id\": \"...\", \"record_id\": \"...\", \"title\": opcional, \"content\": opcional, \"note\": opcional}. En modo append NO escribes el cuerpo — la herramienta inserta la transcripción real del chat por sí misma; solo pasa `content` cuando deliberadamente quieras guardar un resumen de autoría del agente."
guideline: "`turns_to_include` por defecto es 3. Usa 'all' cuando el usuario diga «guarda toda esta conversación». Nunca inventes ids de cuadernos ni de registros — el enum del esquema lista notebook_ids válidos, y `list_notebook` te da los record ids. El `note` opcional es un comentario corto («por qué importa», «contexto a recordar»), no el cuerpo."
note: "Se monta automáticamente solo cuando el usuario tiene al menos un cuaderno. Si tiene éxito, el resultado incluye el nombre del cuaderno destino + id del registro — muéstraselos al usuario como confirmación. Para ediciones, el resultado confirma qué campo(s) cambió."
phase: "synthesis"

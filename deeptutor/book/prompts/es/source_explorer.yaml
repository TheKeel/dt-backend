queries_system: |
  Eres el SourceExplorer de BookEngine de DeepTutor. Dado un ``BookProposal``
  confirmado y la intención del estudiante, diseña un conjunto de 4-8 consultas
  de búsqueda cortas y diversas que, al ejecutarse contra las bases de conocimiento
  del estudiante (y otras fuentes), revelen la evidencia más útil y estructuralmente
  diversa para diseñar un buen libro sobre el tema.

  Pautas:
  - Cubre AMPLITUD: incluye consultas sobre panorama/definiciones, mecanismos,
    ejemplos/casos representativos, casos límite o errores comunes, aplicaciones y
    contexto histórico/comparativo.
  - Escribe todo en español estricto.
  - Cada consulta debe ser autocontenida (3-12 palabras), lo bastante específica para
    recuperar algo concreto, pero no tan estrecha que duplique otra consulta.
  - Evita duplicar consultas; asegura cobertura conceptual.

  Devuelve ÚNICAMENTE un objeto JSON de la forma:
  {
    "queries": ["...", "...", ...]
  }

queries_user: |
  Intención del estudiante:
  {user_intent}

  Propuesta aprobada:
  {proposal_block}

  Bases de conocimiento disponibles:
  {kb_list}

  Otro contexto (destacados del cuaderno / chats):
  {extra_context}

  Diseña ahora las consultas de búsqueda. Responde solo con el objeto JSON.

summary_system: |
  Estás resumiendo una exploración sobre los materiales fuente del estudiante
  (bases de conocimiento, registros del cuaderno, chats previos, historial de quizzes)
  para BookEngine de DeepTutor.

  Lee los fragmentos y produce:
  - ``summary``: 4-8 frases que describan los temas recurrentes, la evidencia más
    sólida que ofrecen las fuentes y los huecos o puntos débiles que la columna
    vertebral (spine) debería abordar.
  - ``candidate_concepts``: 8-20 etiquetas de concepto cortas (≤ 5 palabras cada una) que
    serán nodos candidatos del grafo de conceptos. Prefiere términos atómicos y reutilizables
    antes que frases largas.
  - ``notes``: lista opcional (≤ 5) de advertencias / contradicciones /
    preguntas de seguimiento que valga la pena señalar.

  Escribe todo en español estricto.

  Devuelve ÚNICAMENTE un objeto JSON:
  {
    "summary": "...",
    "candidate_concepts": ["...", "..."],
    "notes": ["..."]
  }

summary_user: |
  Intención del estudiante:
  {user_intent}

  Título de la propuesta: {proposal_title}
  Alcance de la propuesta: {proposal_scope}

  Cobertura por fuente:
  {coverage_block}

  Fragmentos recuperados principales (truncados):
  {chunks_block}

  Produce ahora el objeto JSON.

system_template: |
  Eres el generador de tarjetas de memoria de BookEngine de DeepTutor. Devuelve JSON:
  {{"cards": [{{"front": "...", "back": "...", "hint": "..."}}]}}
  con {count} tarjetas de alto valor. ``front`` es la pregunta, ``back`` es una
  respuesta concisa.


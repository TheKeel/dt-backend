  reasoning_budget_exhausted: "El modelo agotó su presupuesto de salida en razonamiento interno dos veces sin producir respuesta ni acción de herramienta. Reintenta, baja el esfuerzo de razonamiento o divide la tarea en pasos más pequeños."


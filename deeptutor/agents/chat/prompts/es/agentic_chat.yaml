  skipped_reply: "(omitido)"
  question_fallback: "(pregunta)"
  user_answered: "El usuario respondió:"
  no_tool_traces: "No se llamó ninguna herramienta en este turno."
  no_intermediate_trace: "No se proporcionó traza intermedia de ejecución."
